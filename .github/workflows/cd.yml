name: CD Pipeline

on:
  push:
    branches: [main] # শুধু মেইন ব্রাঞ্চে পুশ হলে এটি কাজ করবে

jobs:
  # ১. প্রথম জব: ডকার হাবে ইমেজ পুশ করা
  docker_hub_push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-larn:latest # 'docker-larn' এর বদলে আপনার ইমেজের নাম দিতে পারেন

  # ২. দ্বিতীয় জব: ভেরসেলে কোড ডিপ্লয় করা
  vercel_deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: docker_hub_push # ডকার হাবে পুশ হওয়ার পর এটি শুরু হবে
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}